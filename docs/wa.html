<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري تحويلك إلى واتساب | هيلينج تاتش مصر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --primary: #065F46;
      --primary-light: #10B981;
      --text: #0F172A;
      --muted: #64748B;
      --accent: #D97706;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #ECFDF5 0%, #F8FAFC 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .bridge-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(6, 95, 70, 0.1), 0 8px 10px -6px rgba(6, 95, 70, 0.05);
      border: 1px solid #D1FAE5;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      background: #ECFDF5;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 16px;
      border: 2px solid #A7F3D0;
    }
    h2 {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 1.35rem;
      font-weight: 800;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0 0 20px;
      line-height: 1.6;
    }
    .promo-pill {
      background: #FEF3C7;
      border: 1px dashed var(--accent);
      color: #92400E;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 24px;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid #E2E8F0;
      border-top-color: var(--primary-light);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-manual {
      display: inline-block;
      width: 100%;
      background: #25D366;
      color: #FFFFFF;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
      transition: all 0.2s;
    }
    .btn-manual:hover {
      background: #1EBE5D;
    }
  </style>
</head>
<body>
  <div class="bridge-card">
    <div class="brand-icon">🌿</div>
    <h2>هيلينج تاتش مصر</h2>
    <p id="bridge-status">جاري تسجيل طلب الاستشارة وتوجيهك مباشرة إلى أخصائية العناية بالتعافي عبر واتساب...</p>
    
    <div class="promo-pill" id="promo-display">🎁 كود الخصم (HT10): شحن مجاني + حق المعاينة</div>

    <div class="spinner" id="spinner"></div>

    <a href="#" class="btn-manual" id="manual-btn">💬 فتح واتساب الآن</a>
  </div>

  <script>
    const TRACKING_ENDPOINT = "https://script.google.com/macros/s/AKfycbwDYeWbB9SjUqX1RXH7DaZ8yqG6V5Ay7yAiJ9L27Du1pJ8zb-NVgXzw6oz_0wJVp8Fr/exec";
    const WA_PHONE = "201155803307";

    // قراءة البيانات من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const caseType = urlParams.get('case') || 'general';
    const topicParam = urlParams.get('topic') || '';
    const code = urlParams.get('code') || 'HT10';
    const sourceParam = urlParams.get('source') || 'فيسبوك - دراسة حالة سريرية';

    const TOPIC_TITLES = {
      'c-section': 'جرح القيصرية والندبات وعزل الماء',
      'rhinoplasty': 'تجميل الأنف ودعامة السيليكون وتورم الأرنبة',
      'bariatric': 'جراحات السمنة وثقوب المنظار وبخاخ أوبسايت',
      'thyroid': 'جراحة الغدة والرقبة وحماية الندبة',
      'general': 'استشارة التعافي بعد العمليات'
    };

    const resolvedTopic = topicParam || TOPIC_TITLES[caseType] || 'استشارة طبية بعد العمليات';

    // إعداد رسالة الواتساب
    const waText = "أهلاً بكِ، محتاجة استشارة مجانية مع أخصائية التعافي بخصوص (" + resolvedTopic + ") مع كود الخصم الحصري (" + code + " - شحن مجاني لكافة المحافظات ومعاينة قبل الدفع).";
    const waUrl = "https://wa.me/" + WA_PHONE + "?text=" + encodeURIComponent(waText);

    document.getElementById('manual-btn').href = waUrl;

    // تسجيل الليد تلقائياً في جوجل شيت عبر الويب هوك
    const leadPayload = {
      name: "عميل مهتم (نقرة رابط فيسبوك)",
      phone: "محادثة مباشرة عبر واتساب",
      surgery_type: resolvedTopic,
      promo_code: code,
      source: sourceParam,
      notes: "نقر العميل على رابط استشارة واتساب من بوست: " + resolvedTopic
    };

    let redirected = false;
    function doRedirect() {
      if (redirected) return;
      redirected = true;
      window.location.href = waUrl;
    }

    // إرسال البيانات لجوجل شيت فوراً
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon(TRACKING_ENDPOINT, JSON.stringify(leadPayload));
      }
      fetch(TRACKING_ENDPOINT, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(leadPayload)
      }).catch(function(e) { console.warn(e); });
    } catch(err) {
      console.warn("Tracking error:", err);
    }

    // التوجيه السريع خلال 350 مللي ثانية (فائق السرعة)
    setTimeout(doRedirect, 350);
  </script>
</body>
</html>
