<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تأكيد الاستشارة المجانية | هيلينج تاتش مصر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --teal-deep: #0D4A4D;
      --teal-mid: #145E63;
      --teal-light: #E6F4F1;
      --primary: #065F46;
      --primary-light: #10B981;
      --text: #0F172A;
      --muted: #64748B;
      --accent: #D97706;
      --border: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #ECFDF5 0%, #F1F5F9 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .bridge-card {
      background: var(--surface);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 40px -10px rgba(13, 74, 77, 0.12), 0 8px 16px -6px rgba(13, 74, 77, 0.06);
      border: 1px solid #D1FAE5;
      text-align: right;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .brand-icon {
      width: 60px;
      height: 60px;
      background: #ECFDF5;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 12px;
      border: 2px solid #A7F3D0;
    }
    h1 {
      margin: 0 0 6px;
      color: var(--teal-deep);
      font-size: 1.35rem;
      font-weight: 800;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .topic-badge {
      background: var(--teal-light);
      color: var(--teal-deep);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      margin: 16px 0;
      border: 1px solid #B2DFDB;
      text-align: center;
    }
    .promo-pill {
      background: #FEF3C7;
      border: 1px dashed var(--accent);
      color: #92400E;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--teal-deep);
      margin-bottom: 6px;
    }
    .form-group label span.req {
      color: #DC2626;
      font-size: 0.82rem;
    }
    .input-field {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      font-family: inherit;
      font-size: 0.95rem;
      background: #FAFAFA;
      transition: all 0.2s;
      outline: none;
    }
    .input-field:focus {
      border-color: var(--primary);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
    .alert-box {
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #B91C1C;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: none;
      line-height: 1.5;
    }
    .btn-submit {
      width: 100%;
      background: #25D366;
      color: #FFFFFF;
      border: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1.05rem;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover:not(:disabled) {
      background: #1EBE5D;
      transform: translateY(-1px);
    }
    .btn-submit:disabled {
      background: #94A3B8;
      cursor: not-allowed;
      box-shadow: none;
    }
    .security-note {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="bridge-card">
    <div class="brand-header">
      <div class="brand-icon">🌿</div>
      <h1>هيلينج تاتش مصر</h1>
      <p class="subtitle">تأكيد حجز الاستشارة المجانية مع أخصائية التعافي الجراحي</p>
    </div>

    <div class="topic-badge" id="topic-badge">📋 جاري تجهيز الاستشارة...</div>

    <div class="promo-pill">
      <span>🎁</span>
      <span>كود الخصم الحصري (HT10): شحن مجاني لكافة المحافظات + حق المعاينة قبل الدفع</span>
    </div>

    <div id="wa-alert" class="alert-box"></div>

    <form id="lead-bridge-form" onsubmit="handleBridgeSubmit(event)">
      <div class="form-group">
        <label for="cust-name">الاسم بالكامل <span class="req">* (إلزامي لتسجيل ملف الاستشارة)</span></label>
        <input type="text" id="cust-name" class="input-field" placeholder="اكتب اسمك الكريم هنا..." required autofocus>
      </div>

      <div class="form-group">
        <label for="cust-phone">رقم الموبايل / واتساب <span class="req">* (إلزامي 11 رقماً لتفعيل كود الخصم)</span></label>
        <input type="tel" id="cust-phone" class="input-field" placeholder="01xxxxxxxxx" maxlength="11" required>
      </div>

      <button type="submit" id="submit-btn" class="btn-submit">
        <span>💬 تأكيد الحجز وفتح الاستشارة عبر واتساب</span>
      </button>
    </form>

    <p class="security-note">
      🔒 خصوصيتك أولويتنا: يتم تسجيل ملف الاستشارة وتثبيت كود الخصم تلقائياً قبل فتح محادثة الواتساب المباشرة.
    </p>
  </div>

  <script>
    const TRACKING_ENDPOINT = "https://script.google.com/macros/s/AKfycbwDYeWbB9SjUqX1RXH7DaZ8yqG6V5Ay7yAiJ9L27Du1pJ8zb-NVgXzw6oz_0wJVp8Fr/exec";
    const WA_PHONE = "201155803307";

    // قراءة البيانات من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const caseType = urlParams.get('case') || 'general';
    const topicParam = urlParams.get('topic') || '';
    const code = urlParams.get('code') || 'HT10';
    const sourceParam = urlParams.get('source') || 'فيسبوك - استشارة سريرية';

    const TOPIC_TITLES = {
      'c-section': 'جرح القيصرية والندبات وتأمين الاستحمام',
      'rhinoplasty': 'تجميل الأنف ودعامة السيليكون وتورم الأرنبة',
      'bariatric': 'جراحات السمنة والتكميم وثقوب المنظار وبخاخ أوبسايت',
      'thyroid': 'جراحة الغدة الدرقية وحماية ندبة الرقبة',
      'general': 'استشارة التعافي بعد العمليات وعلاج الندبات'
    };

    const resolvedTopic = topicParam || TOPIC_TITLES[caseType] || 'استشارة طبية بعد العمليات';
    document.getElementById('topic-badge').innerText = "📌 موضوع الاستشارة: " + resolvedTopic;

    function showAlert(msg) {
      const alertBox = document.getElementById('wa-alert');
      alertBox.innerText = msg;
      alertBox.style.display = 'block';
    }

    function handleBridgeSubmit(e) {
      e.preventDefault();
      const alertBox = document.getElementById('wa-alert');
      alertBox.style.display = 'none';

      const nameInput = document.getElementById('cust-name');
      const phoneInput = document.getElementById('cust-phone');
      const submitBtn = document.getElementById('submit-btn');

      const nameVal = nameInput ? nameInput.value.trim() : '';
      const phoneVal = phoneInput ? phoneInput.value.trim().replace(/\s+/g, '') : '';

      if (!nameVal || nameVal.length < 2) {
        showAlert("⚠️ يرجى إدخال اسمك الكريم (حرفين على الأقل) أولاً لتسجيل ملف الاستشارة.");
        nameInput.focus();
        return;
      }

      const egyptPhoneRegex = /^01[0125][0-9]{8}$/;
      if (!phoneVal || !egyptPhoneRegex.test(phoneVal)) {
        showAlert("⚠️ يرجى إدخال رقم موبايل/واتساب مصري صحيح مكون من 11 رقماً يبدأ بـ 01 (مثال: 01012345678) لتفعيل كود الخصم وتأكيد الاستشارة.");
        phoneInput.focus();
        return;
      }

      // تعطيل الزر لمنع تكرار الإرسال
      submitBtn.disabled = true;
      submitBtn.innerHTML = "<span>⏳ جاري تثبيت الحجز وتوجيهك لواتساب...</span>";

      // تجهيز رسالة الواتساب الدقيقة باسم العميل والموضوع
      const waText = "أهلاً بكِ، أنا (" + nameVal + ") مسجل في موقع هيلينج تاتش، ومعايا كود العرض الحصري (" + code + " - شحن مجاني لكافة المحافظات ومعاينة قبل الدفع)، ومحتاج استشارة مجانية بخصوص (" + resolvedTopic + ").";
      const waUrl = "https://wa.me/" + WA_PHONE + "?text=" + encodeURIComponent(waText);

      // البيانات الرسمية المطابقة لأعمدة الشيت بدقة
      const leadPayload = {
        patient_name: nameVal,
        patient_phone: phoneVal,
        context_topic: resolvedTopic,
        channel: "whatsapp",
        promo_code: code,
        page_url: window.location.href,
        source: sourceParam,
        notes: "تم حجز الاستشارة وتأكيد كود الخصم HT10 من صفحة التحويل"
      };

      // إرسال البيانات لجوجل شيت فوراً
      try {
        if (navigator.sendBeacon) {
          navigator.sendBeacon(TRACKING_ENDPOINT, JSON.stringify(leadPayload));
        } else {
          fetch(TRACKING_ENDPOINT, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(leadPayload)
          }).catch(function(err) {});
        }
      } catch(err) {
        console.warn("Tracking dispatch error:", err);
      }

      // تحويل العميل لواتساب بعد 350 مللي ثانية لضمان انطلاق طلب التسجيل للشيت
      setTimeout(function() {
        window.location.href = waUrl;
      }, 350);
    }
  </script>
</body>
</html>
